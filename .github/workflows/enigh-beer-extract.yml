name: enigh-beer-extract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/enigh-beer-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose ENIGH 2016 download
        shell: bash
        run: |
          mkdir -p output
          url='https://www.inegi.org.mx/contenidos/programas/enigh/nc/2016/datosabiertos/conjunto_de_datos_enigh2016_nueva_serie_csv.zip'
          expected='95e30780dfff83305fd1293945a0a5ed04c4e4daed4b0d45b66343db09e8eca1'
          set +e
          curl -L --retry 2 --connect-timeout 30 -A 'Mozilla/5.0' \
            -D output/headers.txt -w '\nHTTP_CODE=%{http_code}\nSIZE_DOWNLOAD=%{size_download}\nURL_EFFECTIVE=%{url_effective}\n' \
            "$url" -o output/enigh2016.zip > output/curl_summary.txt 2> output/curl_stderr.txt
          rc=$?
          echo "$rc" > output/curl_exit_code.txt
          if [[ -f output/enigh2016.zip ]]; then
            stat -c '%s' output/enigh2016.zip > output/size_bytes.txt
            sha256sum output/enigh2016.zip > output/sha256.txt
            unzip -t output/enigh2016.zip > output/unzip_test.txt 2>&1
            unzip -Z1 output/enigh2016.zip | grep -i 'gastoshogar' > output/gastoshogar_members.txt 2>&1
            member="$(unzip -Z1 output/enigh2016.zip | grep -iE '(^|/)gastoshogar\.csv$' | head -n 1)"
            if [[ -n "$member" ]]; then
              unzip -p output/enigh2016.zip "$member" | head -n 1 > output/gastoshogar_header.txt
            fi
          fi
          echo "expected_sha256=$expected" > output/expected.txt
          exit 0

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enigh-download-diagnostic
          path: output/
          if-no-files-found: error
          retention-days: 3
